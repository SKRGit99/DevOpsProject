services:
  # Container A: Source Student API
  student-management-api:
    build:
      context: ./StudentManagementAPI
      dockerfile: Dockerfile
    image: studentmanagementapp-rest-api:0.0.1.release
    container_name: student-api-container
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__SchoolManagementAppDbConnectionString=Server=host.docker.internal,1433;Database=SchoolManagementAppDevDb;User Id=schoolappuserlogin;Password=Sampat@123;TrustServerCertificate=True
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - school-network

  # Container B: Centralized Collector & Sync API
  sync-api:
    build:
      context: ./SchoolManagementAPI
      dockerfile: Dockerfile
    image: schoolmanagementapp-rest-api:0.0.1.release
    container_name: sync-api-container
    ports:
      - "8081:8080"   # Exposed on host port 8081
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - StudentApiSettings__BaseUrl=http://student-management-api:8080
      - ConnectionStrings__SchoolManagementAppDbConnectionString=Server=host.docker.internal,1433;Database=SchoolManagementAppDevDb;User Id=schoolappuserlogin;Password=Sampat@123;TrustServerCertificate=True
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - student-management-api
    networks:
      - school-network

networks:
  school-network:
    driver: bridge